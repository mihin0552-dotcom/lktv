<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }
    header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid #2a2a3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .logo-title span { color: #e94560; }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 400px;
      min-width: 200px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border-radius: 12px;
      border: 1px solid #2a2a3a;
      background: #12121e;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      border-color: #e94560;
      box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15);
    }
    .search-box input::placeholder { color: #666; }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 16px;
      pointer-events: none;
    }

    /* Custom URL Play Box */
    .custom-url-box {
      display: flex;
      gap: 10px;
      padding: 12px 24px;
      background: #0f0f1a;
      border-bottom: 1px solid #2a2a3a;
    }
    .custom-url-box input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #2a2a3a;
      background: #12121e;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .custom-url-box input:focus {
      border-color: #e94560;
    }
    .custom-url-box input::placeholder { color: #666; }
    .custom-url-box button {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: white;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .custom-url-box button:hover {
      background: #d63850;
    }
    .custom-url-box button:active {
      transform: scale(0.97);
    }

    .stats {
      padding: 12px 24px;
      color: #888;
      font-size: 13px;
      border-bottom: 1px solid #1a1a2a;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      padding: 24px;
    }
    .channel {
      background: linear-gradient(145deg, #16162a 0%, #1a1a30 100%);
      border-radius: 14px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
      border: 1px solid #2a2a3a;
      text-align: center;
      min-height: 140px;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .channel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(233,69,96,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .channel:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border-color: #e94560;
    }
    .channel:hover::before { opacity: 1; }
    .channel img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      padding: 6px;
      transition: transform 0.2s;
    }
    .channel:hover img { transform: scale(1.08); }
    .channel .fallback-logo {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #e94560;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .channel .ch-name {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 100%;
    }
    .channel .group-tag {
      font-size: 10px;
      color: #666;
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }

    /* Player */
    .player-wrap {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 9999;
    }
    .player-wrap.active { display: block; }
    .player-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .player-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .player-wrap:hover .player-overlay { opacity: 1; }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10000;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: none;
      color: white;
      font-size: 22px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    .close-btn:hover {
      background: rgba(233, 69, 96, 0.8);
      transform: scale(1.05);
    }
    
    .player-info {
      position: absolute;
      bottom: 60px;
      left: 24px;
      right: auto;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .player-wrap:hover .player-info { opacity: 1; }
    
    .player-info img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      padding: 4px;
    }
    .player-info .info-text { display: flex; flex-direction: column; }
    .player-info .info-name { font-size: 15px; font-weight: 600; }
    .player-info .info-group { font-size: 12px; color: #aaa; margin-top: 2px; }

    /* Error Overlay */
    .player-error {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 10001;
    }
    .player-error h2 { color: #e94560; margin-bottom: 12px; font-size: 24px; }
    .player-error p { color: #ccc; max-width: 500px; margin-bottom: 20px; line-height: 1.5; }
    .player-error button {
      padding: 10px 24px;
      border-radius: 8px;
      border: none;
      background: #e94560;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #666;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }

    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      .logo-title { font-size: 20px; }
      .search-box { max-width: 100%; }
      .custom-url-box { flex-direction: column; padding: 12px 16px; }
      .custom-url-box button { width: 100%; padding: 12px; }
      .grid { padding: 16px; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .channel { min-height: 120px; padding: 12px 8px; }
      .channel img, .channel .fallback-logo { width: 56px; height: 56px; }
      .player-info { bottom: 80px; left: 12px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-title">📺 My <span>TV</span></div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search channels...">
    </div>
  </header>

  <!-- Custom URL Input Box -->
  <div class="custom-url-box">
    <input type="text" id="customUrlInput" placeholder="Paste MPD / M3U8 / Stream URL here... (e.g. https://.../cenc.mpd|drmScheme=clearkey&drmLicense=keyid:key)">
    <button id="playCustomBtn">▶ Play Custom URL</button>
  </div>

  <div class="stats" id="stats">Loading channels...</div>
  <div id="channels" class="grid"></div>

  <div id="playerWrap" class="player-wrap">
    <video id="video" controls playsinline></video>
    
    <div class="player-overlay">
      <span style="font-size:15px; font-weight:600;">Now Playing</span>
    </div>
    
    <button id="closeBtn" class="close-btn">✕</button>
    
    <div class="player-info" id="playerInfo">
      <img id="nowPlayingLogo" src="" alt="" onerror="this.style.display='none'">
      <div class="info-text">
        <span class="info-name" id="nowPlayingName"></span>
        <span class="info-group" id="nowPlayingGroup"></span>
      </div>
    </div>

    <div class="player-error" id="playerError">
      <h2>Playback Error</h2>
      <p id="errorMessage">Could not load the stream. The CDN may be blocking the request or the link is invalid.</p>
      <button onclick="closePlayer()">Close Player</button>
    </div>
  </div>

  <!-- Shaka Player -->
  <script src="https://ajax.googleapis.com/ajax/libs/shaka-player/4.7.11/shaka-player.compiled.js"></script>

  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    
    // Your Cloudflare Worker Proxy URL
    const PROXY_URL = 'https://playerprox.miinbandara.workers.dev/';
    
    // The original playlist URL
    const ORIGINAL_PLAYLIST = 'https://lktv.miinbandara.workers.dev/playlist.m3u?key=mykey1';
    
    // Route the playlist through the proxy
    const PLAYLIST_URL = PROXY_URL + '?url=' + encodeURIComponent(ORIGINAL_PLAYLIST);

    const LOGO_SOURCES = [
      'https://live.fanmingming.cn/tv/',
      'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/international/',
      'https://raw.githubusercontent.com/Fourqui/tv/master/countries/international/',
    ];

    // ==========================================
    // DOM ELEMENTS
    // ==========================================
    const channelsEl  = document.getElementById('channels');
    const statsEl     = document.getElementById('stats');
    const searchInput = document.getElementById('searchInput');
    const playerWrap  = document.getElementById('playerWrap');
    const video       = document.getElementById('video');
    const closeBtn    = document.getElementById('closeBtn');
    const nowPlayingLogo  = document.getElementById('nowPlayingLogo');
    const nowPlayingName  = document.getElementById('nowPlayingName');
    const nowPlayingGroup = document.getElementById('nowPlayingGroup');
    const playerError     = document.getElementById('playerError');
    const errorMessage    = document.getElementById('errorMessage');
    
    const customUrlInput = document.getElementById('customUrlInput');
    const playCustomBtn  = document.getElementById('playCustomBtn');

    let allChannels = [];
    let shakaPlayer = null;

    // ==========================================
    // SHAKA PLAYER INIT
    // ==========================================
    async function initShaka() {
      shaka.polyfill.installAll();
      
      if (!shaka.Player.isBrowserSupported()) {
        console.error('Shaka Player is not supported in this browser.');
        return;
      }

      shakaPlayer = new shaka.Player();
      await shakaPlayer.attach(video);

      // Global Error Listener
      shakaPlayer.addEventListener('error', (event) => {
        const error = event.detail;
        console.error('Shaka Error:', error);
        let msg = 'Playback failed. ';
        if (error.code === 1001) msg += 'The stream may be offline or blocked.';
        else if (error.code === 1002) msg += 'Network error (CORS or 400 Bad Request). Check your proxy settings.';
        else if (error.code === 3016) msg += 'DRM Key error. Check your ClearKey values.';
        else msg += `Error Code: ${error.code}`;
        
        showError(msg);
      });
    }

    // ==========================================
    // PLAYLIST LOADING
    // ==========================================
    async function loadPlaylist() {
      try {
        const res = await fetch(PLAYLIST_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        allChannels = parseM3U(text);
        renderChannels(allChannels);
        statsEl.textContent = `${allChannels.length} channels loaded`;
      } catch (e) {
        channelsEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <p>Failed to load playlist: ${e.message}</p>
            <p style="margin-top:8px;font-size:13px;">Check if your Cloudflare Worker is online.</p>
          </div>`;
        statsEl.textContent = 'Error loading playlist';
      }
    }

    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const channels = [];
      let current = null;

      for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const nameMatch   = line.match(/,(.*)$/);
          const logoMatch   = line.match(/tvg-logo="([^"]*)"/);
          const groupMatch  = line.match(/group-title="([^"]*)"/);
          const tvgNameMatch = line.match(/tvg-name="([^"]*)"/);

          current = {
            name:  nameMatch  ? nameMatch[1].trim()  : 'Unknown',
            logo:  logoMatch  ? logoMatch[1]         : '',
            group: groupMatch ? groupMatch[1]        : '',
            tvgName: tvgNameMatch ? tvgNameMatch[1]  : ''
          };
        } else if (!line.startsWith('#')) {
          if (current) {
            current.url = line;
            channels.push(current);
            current = null;
          }
        }
      }
      return channels;
    }

    // ==========================================
    // LOGO RESOLUTION
    // ==========================================
    function getLogoUrl(channel) {
      if (channel.logo && channel.logo.startsWith('http')) return channel.logo;

      const name = (channel.tvgName || channel.name || '')
        .replace(/\s+/g, '')
        .replace(/[^\w\u4e00-\u9fa5-]/g, '')
        .trim();

      if (!name) return '';
      return LOGO_SOURCES[0] + name + '.png';
    }

    function setupLogoFallback(imgEl, channel) {
      let attempt = 0;
      imgEl.onerror = function () {
        attempt++;
        if (attempt < LOGO_SOURCES.length) {
          const name = (channel.tvgName || channel.name || '')
            .replace(/\s+/g, '')
            .replace(/[^\w\u4e00-\u9fa5-]/g, '')
            .trim();
          if (name) {
            imgEl.src = LOGO_SOURCES[attempt] + name + '.png';
            return;
          }
        }
        imgEl.style.display = 'none';
        const fallback = imgEl.nextElementSibling;
        if (fallback && fallback.classList.contains('fallback-logo')) {
          fallback.style.display = 'flex';
        }
      };
    }

    // ==========================================
    // RENDER CHANNELS
    // ==========================================
    function renderChannels(channels) {
      if (!channels.length) {
        channelsEl.innerHTML = `<div class="empty-state"><div class="icon">📭</div><p>No channels found.</p></div>`;
        return;
      }

      channelsEl.innerHTML = '';
      const fragment = document.createDocumentFragment();

      channels.forEach((ch) => {
        const card = document.createElement('div');
        card.className = 'channel';
        card.dataset.name  = ch.name.toLowerCase();
        card.dataset.group = (ch.group || '').toLowerCase();

        const logoUrl = getLogoUrl(ch);
        const initial = (ch.name || '?').charAt(0).toUpperCase();

        let logoHtml = '';
        if (logoUrl) {
          logoHtml = `<img src="${logoUrl}" alt="${ch.name}" loading="lazy" onerror="">`;
        } else {
          logoHtml = `<div class="fallback-logo">${initial}</div>`;
        }
        logoHtml += `<div class="fallback-logo" style="display:none;">${initial}</div>`;

        card.innerHTML = `
          ${logoHtml}
          <div class="ch-name">${ch.name}</div>
          ${ch.group ? `<div class="group-tag">${ch.group}</div>` : ''}
        `;

        const imgEl = card.querySelector('img');
        if (imgEl) setupLogoFallback(imgEl, ch);

        card.onclick = () => playChannel(ch);
        fragment.appendChild(card);
      });

      channelsEl.appendChild(fragment);
    }

    // ==========================================
    // SEARCH
    // ==========================================
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      const cards = channelsEl.querySelectorAll('.channel');
      let visible = 0;
      cards.forEach(card => {
        const match = card.dataset.name.includes(q) || card.dataset.group.includes(q);
        card.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      statsEl.textContent = q
        ? `${visible} of ${allChannels.length} channels match "${q}"`
        : `${allChannels.length} channels loaded`;
    });

    // ==========================================
    // DRM PARSING
    // ==========================================
    function parseDrmParams(url) {
      let manifestUrl = url;
      let clearKeys = null;

      if (url.includes('|')) {
        const parts = url.split('|');
        manifestUrl = parts[0];

        // Ensure the base URL is properly encoded
        manifestUrl = encodeURI(manifestUrl);

        const queryString = parts.slice(1).join('|');
        const params = new URLSearchParams(queryString);

        const drmScheme = params.get('drmScheme');
        const drmLicense = params.get('drmLicense');

        if (drmScheme === 'clearkey' && drmLicense) {
          const [kid, key] = drmLicense.split(':');
          if (kid && key) {
            clearKeys = { [kid.trim()]: key.trim() };
          }
        }
      } else {
        manifestUrl = encodeURI(manifestUrl);
      }

      return { manifestUrl, clearKeys };
    }

    // ==========================================
    // PLAY CHANNEL (With Proxy Integration)
    // ==========================================
    async function playChannel(ch) {
      if (!shakaPlayer) {
        showError('Shaka Player is not initialized yet.');
        return;
      }

      // Hide error overlay, show player
      playerError.style.display = 'none';
      playerWrap.classList.add('active');

      const logoUrl = getLogoUrl(ch);
      nowPlayingLogo.src = logoUrl || '';
      nowPlayingLogo.style.display = logoUrl ? 'block' : 'none';
      nowPlayingName.textContent  = ch.name;
      nowPlayingGroup.textContent = ch.group || '';

      // 1. Parse the original URL to get the clean MPD link and ClearKeys
      const parsed = parseDrmParams(ch.url);

      // 2. Wrap the CLEAN manifest URL with your Cloudflare Worker proxy
      const proxiedUrl = PROXY_URL + '?url=' + encodeURIComponent(parsed.manifestUrl);

      // 3. Configure Shaka Player with ClearKey if present
      if (parsed.clearKeys) {
        shakaPlayer.configure({
          drm: {
            clearKeys: parsed.clearKeys
          }
        });
      } else {
        shakaPlayer.configure({ drm: { clearKeys: {} } });
      }

      // 4. Load the proxied URL
      try {
        await shakaPlayer.load(proxiedUrl);
        video.play().catch(e => console.log('Autoplay blocked:', e));
        requestFullscreen(playerWrap);
      } catch (e) {
        console.error('Shaka load failed:', e);
        // Error is handled by the global event listener
      }
    }

    function showError(msg) {
      errorMessage.textContent = msg;
      playerError.style.display = 'flex';
    }

    function requestFullscreen(el) {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }

    // ==========================================
    // CLOSE PLAYER
    // ==========================================
    function closePlayer() {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      
      playerWrap.classList.remove('active');
      playerError.style.display = 'none';
      
      if (shakaPlayer) {
        shakaPlayer.unload().catch(() => {});
      }
      video.pause();
      video.removeAttribute('src');
      video.load();
    }

    closeBtn.onclick = closePlayer;

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && playerWrap.classList.contains('active')) {
        closePlayer();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && playerWrap.classList.contains('active')) {
        closePlayer();
      }
    });

    // ==========================================
    // CUSTOM URL PLAYBACK
    // ==========================================
    function playCustomUrl() {
      const url = customUrlInput.value.trim();
      if (!url) {
        alert('Please paste a stream URL first.');
        return;
      }
      
      const customChannel = {
        name: 'Custom Stream',
        url: url,
        group: 'Custom',
        logo: ''
      };
      
      playChannel(customChannel);
    }

    playCustomBtn.onclick = playCustomUrl;
    customUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') playCustomUrl();
    });

    // ==========================================
    // INIT
    // ==========================================
    initShaka().then(() => {
      loadPlaylist();
    });
  </script>
</body>
</html>
