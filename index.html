<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }
    header {
      padding: 20px 24px;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-bottom: 1px solid #2a2a3a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .logo-title span { color: #e94560; }
    .search-box {
      position: relative;
      flex: 1;
      max-width: 400px;
      min-width: 200px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      border-radius: 12px;
      border: 1px solid #2a2a3a;
      background: #12121e;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-box input:focus {
      border-color: #e94560;
      box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15);
    }
    .search-box input::placeholder { color: #666; }
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #666;
      font-size: 16px;
      pointer-events: none;
    }
    .stats {
      padding: 12px 24px;
      color: #888;
      font-size: 13px;
      border-bottom: 1px solid #1a1a2a;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 16px;
      padding: 24px;
    }
    .channel {
      background: linear-gradient(145deg, #16162a 0%, #1a1a30 100%);
      border-radius: 14px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
      border: 1px solid #2a2a3a;
      text-align: center;
      min-height: 140px;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .channel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(233,69,96,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .channel:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      border-color: #e94560;
    }
    .channel:hover::before { opacity: 1; }
    .channel img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(255,255,255,0.04);
      padding: 6px;
      transition: transform 0.2s;
    }
    .channel:hover img { transform: scale(1.08); }
    .channel .fallback-logo {
      width: 72px;
      height: 72px;
      border-radius: 10px;
      background: linear-gradient(135deg, #2a2a4a, #1a1a3a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #e94560;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .channel .ch-name {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      word-break: break-word;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      max-width: 100%;
    }
    .channel .group-tag {
      font-size: 10px;
      color: #666;
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 90%;
    }

    /* Player */
    .player-wrap {
      position: fixed;
      inset: 0;
      background: #000;
      display: none;
      z-index: 9999;
    }
    .player-wrap.active { display: block; }
    .player-wrap video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    .player-overlay {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .player-wrap:hover .player-overlay { opacity: 1; }
    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10000;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: none;
      color: white;
      font-size: 22px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    .close-btn:hover {
      background: rgba(233, 69, 96, 0.8);
      transform: scale(1.05);
    }
    
    /* UPDATED: Now playing overlay shifted up to avoid native controls */
    .player-info {
      position: absolute;
      bottom: 60px; /* Shifted up from 0 */
      left: 24px;
      right: auto;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .player-wrap:hover .player-info { opacity: 1; }
    
    .player-info img {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      padding: 4px;
    }
    .player-info .info-text { display: flex; flex-direction: column; }
    .player-info .info-name { font-size: 15px; font-weight: 600; }
    .player-info .info-group { font-size: 12px; color: #aaa; margin-top: 2px; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: #666;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }

    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      .logo-title { font-size: 20px; }
      .search-box { max-width: 100%; }
      .grid { padding: 16px; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
      .channel { min-height: 120px; padding: 12px 8px; }
      .channel img, .channel .fallback-logo { width: 56px; height: 56px; }
      .player-info { bottom: 80px; left: 12px; } /* Shifted further up for mobile controls */
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-title">📺 My <span>TV</span></div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search channels...">
    </div>
  </header>
  <div class="stats" id="stats">Loading channels...</div>
  <div id="channels" class="grid"></div>

  <div id="playerWrap" class="player-wrap">
    <video id="player" controls playsinline></video>
    <div class="player-overlay">
      <span style="font-size:15px; font-weight:600;">Now Playing</span>
    </div>
    <button id="closeBtn" class="close-btn">✕</button>
    <div class="player-info" id="playerInfo">
      <img id="nowPlayingLogo" src="" alt="" onerror="this.style.display='none'">
      <div class="info-text">
        <span class="info-name" id="nowPlayingName"></span>
        <span class="info-group" id="nowPlayingGroup"></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const PLAYLIST_URL = 'https://lktv.miinbandara.workers.dev/playlist.m3u?key=mykey1';

    // Logo API base URLs — multiple sources for best coverage
    const LOGO_SOURCES = [
      'https://live.fanmingming.cn/tv/',           // fanmingming — huge coverage
      'https://raw.githubusercontent.com/tv-logo/tv-logos/main/countries/international/', // tv-logos
      'https://raw.githubusercontent.com/Fourqui/tv/master/countries/international/',    // Fourqui
    ];

    const channelsEl  = document.getElementById('channels');
    const statsEl     = document.getElementById('stats');
    const searchInput = document.getElementById('searchInput');
    const playerWrap  = document.getElementById('playerWrap');
    const video       = document.getElementById('player');
    const closeBtn    = document.getElementById('closeBtn');
    const nowPlayingLogo  = document.getElementById('nowPlayingLogo');
    const nowPlayingName  = document.getElementById('nowPlayingName');
    const nowPlayingGroup = document.getElementById('nowPlayingGroup');

    let allChannels = [];
    let hls = null;

    /* ---------- Load & parse playlist ---------- */
    async function loadPlaylist() {
      try {
        const res = await fetch(PLAYLIST_URL);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        allChannels = parseM3U(text);
        renderChannels(allChannels);
        statsEl.textContent = `${allChannels.length} channels loaded`;
      } catch (e) {
        channelsEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">⚠️</div>
            <p>Failed to load playlist: ${e.message}</p>
            <p style="margin-top:8px;font-size:13px;">Check CORS or use a proxy worker.</p>
          </div>`;
        statsEl.textContent = 'Error loading playlist';
      }
    }

    function parseM3U(text) {
      const lines = text.split(/\r?\n/);
      const channels = [];
      let current = null;

      for (let line of lines) {
        line = line.trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const nameMatch   = line.match(/,(.*)$/);
          const logoMatch   = line.match(/tvg-logo="([^"]*)"/);
          const groupMatch  = line.match(/group-title="([^"]*)"/);
          const tvgNameMatch = line.match(/tvg-name="([^"]*)"/);

          current = {
            name:  nameMatch  ? nameMatch[1].trim()  : 'Unknown',
            logo:  logoMatch  ? logoMatch[1]         : '',
            group: groupMatch ? groupMatch[1]        : '',
            tvgName: tvgNameMatch ? tvgNameMatch[1]  : ''
          };
        } else if (!line.startsWith('#')) {
          if (current) {
            current.url = line;
            channels.push(current);
            current = null;
          }
        }
      }
      return channels;
    }

    /* ---------- Logo resolution ---------- */
    function getLogoUrl(channel) {
      if (channel.logo && channel.logo.startsWith('http')) return channel.logo;

      const name = (channel.tvgName || channel.name || '')
        .replace(/\s+/g, '')
        .replace(/[^\w\u4e00-\u9fa5-]/g, '')
        .trim();

      if (!name) return '';
      return LOGO_SOURCES[0] + name + '.png';
    }

    function setupLogoFallback(imgEl, channel) {
      let attempt = 0;
      imgEl.onerror = function () {
        attempt++;
        if (attempt < LOGO_SOURCES.length) {
          const name = (channel.tvgName || channel.name || '')
            .replace(/\s+/g, '')
            .replace(/[^\w\u4e00-\u9fa5-]/g, '')
            .trim();
          if (name) {
            imgEl.src = LOGO_SOURCES[attempt] + name + '.png';
            return;
          }
        }
        imgEl.style.display = 'none';
        const fallback = imgEl.nextElementSibling;
        if (fallback && fallback.classList.contains('fallback-logo')) {
          fallback.style.display = 'flex';
        }
      };
    }

    /* ---------- Render channels ---------- */
    function renderChannels(channels) {
      if (!channels.length) {
        channelsEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>No channels found.</p>
          </div>`;
        return;
      }

      channelsEl.innerHTML = '';
      const fragment = document.createDocumentFragment();

      channels.forEach((ch, idx) => {
        const card = document.createElement('div');
        card.className = 'channel';
        card.dataset.name  = ch.name.toLowerCase();
        card.dataset.group = (ch.group || '').toLowerCase();

        const logoUrl = getLogoUrl(ch);
        const initial = (ch.name || '?').charAt(0).toUpperCase();

        let logoHtml = '';
        if (logoUrl) {
          logoHtml = `<img src="${logoUrl}" alt="${ch.name}" loading="lazy" onerror="">`;
        } else {
          logoHtml = `<div class="fallback-logo">${initial}</div>`;
        }
        logoHtml += `<div class="fallback-logo" style="display:none;">${initial}</div>`;

        card.innerHTML = `
          ${logoHtml}
          <div class="ch-name">${ch.name}</div>
          ${ch.group ? `<div class="group-tag">${ch.group}</div>` : ''}
        `;

        const imgEl = card.querySelector('img');
        if (imgEl) setupLogoFallback(imgEl, ch);

        card.onclick = () => playChannel(ch);
        fragment.appendChild(card);
      });

      channelsEl.appendChild(fragment);
    }

    /* ---------- Search ---------- */
    searchInput.addEventListener('input', () => {
      const q = searchInput.value.trim().toLowerCase();
      const cards = channelsEl.querySelectorAll('.channel');
      let visible = 0;
      cards.forEach(card => {
        const match = card.dataset.name.includes(q) || card.dataset.group.includes(q);
        card.style.display = match ? '' : 'none';
        if (match) visible++;
      });
      statsEl.textContent = q
        ? `${visible} of ${allChannels.length} channels match "${q}"`
        : `${allChannels.length} channels loaded`;
    });

    /* ---------- Play channel ---------- */
    function playChannel(ch) {
      if (hls) { hls.destroy(); hls = null; }
      video.pause();
      video.removeAttribute('src');
      video.load();

      const logoUrl = getLogoUrl(ch);
      nowPlayingLogo.src = logoUrl || '';
      nowPlayingLogo.style.display = logoUrl ? 'block' : 'none';
      nowPlayingName.textContent  = ch.name;
      nowPlayingGroup.textContent = ch.group || '';

      playerWrap.classList.add('active');

      const startPlay = () => {
        video.play().catch(e => console.log('Play error:', e));
        requestFullscreen(playerWrap);
      };

      if (ch.url.includes('.m3u8') && window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(ch.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, startPlay);
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error('HLS error:', data);
        });
      } else {
        video.src = ch.url;
        video.addEventListener('loadedmetadata', startPlay, { once: true });
        video.load();
      }
    }

    function requestFullscreen(el) {
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      else if (el.msRequestFullscreen) el.msRequestFullscreen();
    }

    /* ---------- Close player ---------- */
    function closePlayer() {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      playerWrap.classList.remove('active');
      video.pause();
      if (hls) { hls.destroy(); hls = null; }
    }

    closeBtn.onclick = closePlayer;

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && playerWrap.classList.contains('active')) {
        closePlayer();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && playerWrap.classList.contains('active')) {
        closePlayer();
      }
    });

    /* ---------- Init ---------- */
    loadPlaylist();
  </script>
</body>
</html>
